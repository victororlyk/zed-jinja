id = "jinja"
name = "Jinja"
description = "Jinja2 templates: accurate highlighting with HTML injection, and jinja-lsp."
version = "0.1.0"
schema_version = 1
authors = ["Viktor Orlyk"]
repository = "https://github.com/victororlyk/zed-jinja"

# The grammar lives in this repository, in tree-sitter-jinja/. Zed fetches
# `commit` from `repository`, so after changing the grammar, commit it and put
# that commit's hash here. The commit must already be pushed to GitHub.
[grammars.jinja]
repository = "https://github.com/victororlyk/zed-jinja"
commit = "b5ff7bcf7e634d8bca4a15c85782a9b76dfddece"
path = "tree-sitter-jinja"

[language_servers.jinja-lsp]
name = "jinja-lsp"
languages = ["Jinja"]

[language_servers.jinja-lsp.language_ids]
"Jinja" = "jinja"
